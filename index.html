<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The SVG icon flips black→white via a prefers-color-scheme query inside the file
         (Chrome honours it in a favicon); the PNG is the black fallback Safari and crawlers use. -->
    <link rel="icon" href="/icon.png" type="image/png" sizes="512x512" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" sizes="any" />
    <meta name="theme-color" content="#0b0f17" />

    <!-- Title, description, canonical and the share text differ per lane: the build fills
         this marker from src/pages/routeMeta.ts, and writes file/ and mcp/ copies with theirs. -->
    <!--route-head-->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="xbrlkit" />
    <meta property="og:image" content="https://xbrlkit.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="xbrlkit: open any SEC filing in the browser. No key, no sign-up."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://xbrlkit.com/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Crawlers that do not run JavaScript read only this. The links let them reach the other
         two pages and credit RoboSystems, which the app footer does once rendered. -->
    <noscript>
      <h1>xbrlkit</h1>
      <p>
        xbrlkit.com opens SEC filings in the browser: search any listed company and read its 10-K,
        10-Q, 20-F or 40-F, with no key and no sign-up. <a href="/file">/file</a> opens a
        holon.jsonld or tavi.json report you hold, and <a href="/mcp">/mcp</a> shows how to connect
        an MCP client to xbrlkit serve. This site requires JavaScript.
      </p>
      <p>
        <a href="/">Open an SEC filing</a> · <a href="/file">Open a report file</a> ·
        <a href="/mcp">Connect an MCP client</a> ·
        <a href="https://github.com/RoboFinSystems/xbrlkit">xbrlkit on GitHub</a> ·
        <a href="https://robosystems.ai">A RoboSystems project</a>
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
