Description: xbrlkit viewer - S3 + CloudFront CDN

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
    Description: Environment name

  Namespace:
    Type: String
    Default: ''
    Description: >-
      S3 bucket namespace (typically the AWS account ID) for globally unique
      bucket names. When provided: xbrlkit-viewer-{namespace}-{env}-static-assets.
      When empty: xbrlkit-viewer-{env}-static-assets.

  ServiceTag:
    Type: String
    Default: XbrlkitViewer
    Description: Tag value for Service identification

  ComponentTag:
    Type: String
    Default: Viewer
    Description: Tag value for Component identification

  DomainName:
    Type: String
    Default: ''
    Description: >-
      The viewer's canonical domain (e.g. xbrlkit.com). Blank serves on the
      default CloudFront domain with no ACM cert and no Route53 records.

  HostedZoneId:
    Type: String
    Default: ''
    Description: Route53 hosted zone ID for DomainName (required when DomainName is set).

  WwwDomainName:
    Type: String
    Default: ''
    Description: >-
      Optional www. form of DomainName, in the same hosted zone. Served by the
      same distribution and redirected to DomainName at the edge, so the
      viewer has one canonical origin.

  LegacyDomainName:
    Type: String
    Default: ''
    Description: >-
      Optional earlier name of the viewer, served as an alias of the same
      distribution and deliberately NOT redirected. A published `xbrlkit view`
      opens the viewer at the name it was built with and allows only that
      origin to read the report it serves, so the old name must keep serving
      the app for as long as those releases might be installed.

  LegacyHostedZoneId:
    Type: String
    Default: ''
    Description: Route53 hosted zone ID for LegacyDomainName (required when it is set).

Conditions:
  HasNamespace: !Not [!Equals [!Ref Namespace, '']]
  HasCustomDomain: !Not [!Equals [!Ref DomainName, '']]
  HasWww: !Not [!Equals [!Ref WwwDomainName, '']]
  HasLegacy: !Not [!Equals [!Ref LegacyDomainName, '']]
  HasExtraNames: !Or [!Condition HasWww, !Condition HasLegacy]

Resources:
  # ── Private S3 bucket (origin) ──────────────────────────────────────────────
  StaticAssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - HasNamespace
        - !Sub xbrlkit-viewer-${Namespace}-${Environment}-static-assets
        - !Sub xbrlkit-viewer-${Environment}-static-assets
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # ── CloudFront Origin Access Control (signs requests to the private bucket) ──
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub xbrlkit-viewer-${Environment}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── ACM certificate covering every name (conditional; us-east-1; DNS-validated) ──
  # One validation option per name, each in its own hosted zone: CloudFormation
  # creates the validation records and waits for issuance. Changing the set of
  # names replaces the certificate (the old one is retained, delete by hand).
  # The stack must be deployed in us-east-1 (CloudFront).
  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasCustomDomain
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: !If
        - HasExtraNames
        - - !If [HasWww, !Ref WwwDomainName, !Ref AWS::NoValue]
          - !If [HasLegacy, !Ref LegacyDomainName, !Ref AWS::NoValue]
        - !Ref AWS::NoValue
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - !If
          - HasWww
          - DomainName: !Ref WwwDomainName
            HostedZoneId: !Ref HostedZoneId
          - !Ref AWS::NoValue
        - !If
          - HasLegacy
          - DomainName: !Ref LegacyDomainName
            HostedZoneId: !Ref LegacyHostedZoneId
          - !Ref AWS::NoValue
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag

  # ── Viewer-request function: www. redirect, then the lane pages ────────────
  # Runs on every viewer request, for every name. When the Host is the www.
  # name it redirects to the canonical domain with path and query intact (the
  # legacy name is served, never redirected — see LegacyDomainName). Otherwise
  # it maps the File and MCP lanes to their own index.html, which carry their
  # own title, canonical and share text, and maps `/view` (the link `xbrlkit
  # view` opens) to the apex index.html directly rather than through a bucket
  # miss. The query string is left alone, so a `?url=` link reaches its page
  # untouched. Keep the paths in step with LANE_PATHS and VIEW_PATH in
  # src/pages/route.ts. Any other path misses the bucket and falls through to
  # the apex index.html (CustomErrorResponses below).
  ViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub xbrlkit-viewer-${Environment}-viewer-request
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www. to the canonical domain; map /file, /mcp and /view to their pages
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        var LANE_PAGES = {
          '/file': '/file/index.html',
          '/file/': '/file/index.html',
          '/mcp': '/mcp/index.html',
          '/mcp/': '/mcp/index.html',
          '/view': '/index.html',
          '/view/': '/index.html'
        };

        function handler(event) {
          var request = event.request;
          var www = '${WwwDomainName}';
          var host = request.headers.host ? request.headers.host.value : '';
          if (www !== '' && host === www) {
            // Query values are carried as received, not re-encoded: a ?url=
            // link must reach the canonical origin exactly as it was shared.
            var parts = [];
            var keys = Object.keys(request.querystring);
            for (var i = 0; i < keys.length; i++) {
              var entry = request.querystring[keys[i]];
              if (entry.multiValue) {
                for (var j = 0; j < entry.multiValue.length; j++) {
                  parts.push(keys[i] + '=' + entry.multiValue[j].value);
                }
              } else {
                parts.push(keys[i] + '=' + entry.value);
              }
            }
            var query = parts.length ? '?' + parts.join('&') : '';
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {
                location: { value: 'https://${DomainName}' + request.uri + query }
              }
            };
          }
          var page = LANE_PAGES[request.uri];
          if (page) {
            request.uri = page;
          }
          return request;
        }

  # ── CloudFront distribution ─────────────────────────────────────────────────
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub xbrlkit viewer ${Environment} distribution
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100 # North America + Europe (cost-optimized)
        Aliases: !If
          - HasCustomDomain
          - - !Ref DomainName
            - !If [HasWww, !Ref WwwDomainName, !Ref AWS::NoValue]
            - !If [HasLegacy, !Ref LegacyDomainName, !Ref AWS::NoValue]
          - !Ref AWS::NoValue
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt StaticAssetsBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          # Managed "CachingOptimized" cache policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerRequestFunction.FunctionARN
        # The viewer is a single-page app; serve index.html for any unmatched
        # path (and for the 403 OAC returns on missing keys) so it never 404s.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref SiteCertificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag

  # ── Bucket policy: only this CloudFront distribution may read objects ────────
  StaticAssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticAssetsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${StaticAssetsBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub ${StaticAssetsBucket.Arn}/*
              - !GetAtt StaticAssetsBucket.Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ── Route53 alias records (conditional; A + AAAA for IPv6, per name) ────────
  SiteDNSRecordA:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed hosted zone id
        EvaluateTargetHealth: false

  SiteDNSRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwDNSRecordA:
    Type: AWS::Route53::RecordSet
    Condition: HasWww
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref WwwDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwDNSRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasWww
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref WwwDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  LegacyDNSRecordA:
    Type: AWS::Route53::RecordSet
    Condition: HasLegacy
    Properties:
      HostedZoneId: !Ref LegacyHostedZoneId
      Name: !Ref LegacyDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  LegacyDNSRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasLegacy
    Properties:
      HostedZoneId: !Ref LegacyHostedZoneId
      Name: !Ref LegacyDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  StaticAssetsBucketName:
    Description: S3 bucket for the static build output
    Value: !Ref StaticAssetsBucket

  CloudFrontDistributionId:
    Description: CloudFront distribution ID (used for cache invalidation)
    Value: !Ref CloudFrontDistribution

  CloudFrontDomainName:
    Description: CloudFront distribution domain name (the public URL)
    Value: !GetAtt CloudFrontDistribution.DomainName

  ViewerUrl:
    Description: The deployed viewer URL
    Value: !If
      - HasCustomDomain
      - !Sub https://${DomainName}
      - !Sub https://${CloudFrontDistribution.DomainName}
