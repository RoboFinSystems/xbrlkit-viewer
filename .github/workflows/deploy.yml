name: Deploy

# Static-site deploy for xbrlkit-viewer → S3 + CloudFront.
#
# Mirrors the RoboSystems app deploy conventions (OIDC via vars.AWS_ROLE_ARN,
# CloudFormation-managed infra) but collapsed to a single stack because the
# viewer is a pure-static SPA — no App Runner / ECR. Custom domains are
# optional, from two repo vars: VIEWER_DOMAIN (the canonical name; an apex
# domain also gets its www. form, redirected to it at the edge) and
# VIEWER_LEGACY_DOMAIN (an earlier name of the viewer, served as an alias of
# the same distribution — see the template for why it is never redirected).
# When set, the stack adds one ACM cert covering every name plus the Route53
# aliases, each in its own hosted zone.
#
# PRECONDITIONS (one-time, before the first successful run):
#   1. @robosystems/report-components is PUBLISHED to npm, and this app's
#      package.json depends on the published version (e.g. "^0.1.1"), NOT the
#      local "file:../robosystems-report-components" link — otherwise `npm ci`
#      fails in CI (the sibling repo isn't checked out here).
#   2. Repo variables set: AWS_ROLE_ARN, AWS_ACCOUNT_ID, AWS_REGION.
#   3. The IAM role behind AWS_ROLE_ARN trusts this repo via GitHub OIDC and may
#      run CloudFormation + S3 + CloudFront.
#
# Manual only — deployments are an explicit action, never automatic on push.
#
# Approval-gated: the `gate` job binds the `production` GitHub environment
# (required reviewer, deployment refs main / release/*), so a dispatched run
# waits under "Review deployments" before anything runs — nothing is built or
# synced for an unapproved run. The rules live in the repo's environment
# settings, not here; a fork without that environment deploys ungated.
#
# Only `gate` binds the environment. A job that references an environment
# presents an environment-scoped OIDC subject (repo:…:environment:production)
# instead of the branch ref, and the frontend deploy role trusts refs only —
# binding it on the deploy job made AssumeRoleWithWebIdentity fail (run
# 34009528908). Same shape as the app repos' create-deployment job.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod

permissions:
  id-token: write
  contents: read

# One deploy at a time: two overlapping runs would race the S3 sync --delete
# and the CloudFront invalidation.
concurrency:
  group: xbrlkit-viewer-deploy
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    # The Deployments-tab record belongs to this job, so it reads "success" at
    # approval time; the run's own status is the deploy result.
    environment:
      name: production
      url: ${{ vars.VIEWER_DOMAIN != '' && format('https://{0}', vars.VIEWER_DOMAIN) || '' }}
    steps:
      - name: Approved
        run: echo "Production deploy approved for ${GITHUB_REF_NAME} at ${GITHUB_SHA}"

  deploy:
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30 # CloudFront + ACM cert validation can be slow on first create
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve stack name
        # PascalCase, brand-cased, no hyphen — matches the app convention
        # (e.g. RoboLedgerAppProd) → XbrlkitViewer{Prod,Staging,Dev}.
        run: |
          ENV="${{ inputs.environment }}"
          echo "STACK_NAME=XbrlkitViewer${ENV^}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build # vite build → dist/
        env:
          # Cloudflare Web Analytics site token (not a secret: it ships in the page).
          # Unset → the build emits no beacon, so forks and unconfigured repos stay dark.
          VITE_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN || '' }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve custom domains
        # Domains come from repo vars (set once, no per-run override).
        # VIEWER_DOMAIN unset → serves on the CloudFront URL. Each name's
        # public hosted zone is looked up by its registrable root.
        run: |
          resolve_zone() {
            local root
            root=$(echo "$1" | awk -F. '{print $(NF-1)"."$NF}')
            aws route53 list-hosted-zones \
              --query "HostedZones[?Name=='${root}.' && Config.PrivateZone==\`false\`].Id | [0]" \
              --output text | sed 's#/hostedzone/##'
          }
          DOMAIN="${{ vars.VIEWER_DOMAIN }}"
          if [ -z "$DOMAIN" ]; then
            echo "VIEWER_DOMAIN unset — serving on the CloudFront URL."
            { echo "DOMAIN_NAME="; echo "HOSTED_ZONE_ID="; echo "WWW_DOMAIN_NAME=";
              echo "LEGACY_DOMAIN_NAME="; echo "LEGACY_HOSTED_ZONE_ID="; } >> "$GITHUB_ENV"
            exit 0
          fi
          ZONE_ID=$(resolve_zone "$DOMAIN")
          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "None" ]; then
            echo "ERROR: no public Route53 hosted zone found for ${DOMAIN}"; exit 1
          fi
          # An apex domain (two labels) also gets its www. form, redirected to
          # it at the edge so the viewer keeps one canonical origin.
          WWW=""
          if [ "$(echo "$DOMAIN" | awk -F. '{print NF}')" -eq 2 ]; then
            WWW="www.${DOMAIN}"
          fi
          LEGACY="${{ vars.VIEWER_LEGACY_DOMAIN }}"
          LEGACY_ZONE_ID=""
          if [ -n "$LEGACY" ]; then
            LEGACY_ZONE_ID=$(resolve_zone "$LEGACY")
            if [ -z "$LEGACY_ZONE_ID" ] || [ "$LEGACY_ZONE_ID" = "None" ]; then
              echo "ERROR: no public Route53 hosted zone found for ${LEGACY}"; exit 1
            fi
          fi
          echo "Domain ${DOMAIN} → zone ${ZONE_ID}${WWW:+ (+ ${WWW})}${LEGACY:+; alias ${LEGACY} → zone ${LEGACY_ZONE_ID}}"
          { echo "DOMAIN_NAME=${DOMAIN}"; echo "HOSTED_ZONE_ID=${ZONE_ID}"; echo "WWW_DOMAIN_NAME=${WWW}";
            echo "LEGACY_DOMAIN_NAME=${LEGACY}"; echo "LEGACY_HOSTED_ZONE_ID=${LEGACY_ZONE_ID}"; } >> "$GITHUB_ENV"

      - name: Deploy CloudFormation stack
        run: |
          # Pick the stack action from the stack's actual state. A first create
          # that failed leaves an empty ROLLBACK_COMPLETE stack that cannot be
          # updated; a failed update whose rollback also failed cannot be
          # updated until that rollback is continued.
          if ! STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' --output text 2>&1); then
            if echo "$STACK_STATUS" | grep -q "does not exist"; then
              STACK_STATUS="DOES_NOT_EXIST"
            else
              echo "ERROR: could not describe stack $STACK_NAME: $STACK_STATUS"
              exit 1
            fi
          fi
          echo "Stack $STACK_NAME status: $STACK_STATUS"

          case "$STACK_STATUS" in
            DOES_NOT_EXIST)
              STACK_ACTION="create-stack"
              echo "Creating new stack $STACK_NAME"
              ;;
            ROLLBACK_COMPLETE)
              echo "Failed initial create left an empty stack - deleting it so it can be created again"
              aws cloudformation delete-stack --stack-name "$STACK_NAME"
              aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
              STACK_ACTION="create-stack"
              echo "Creating new stack $STACK_NAME"
              ;;
            UPDATE_ROLLBACK_FAILED)
              echo "Previous update's rollback did not finish - continuing it before updating"
              aws cloudformation continue-update-rollback --stack-name "$STACK_NAME"
              aws cloudformation wait stack-rollback-complete --stack-name "$STACK_NAME"
              STACK_ACTION="update-stack"
              echo "Updating existing stack $STACK_NAME"
              ;;
            DELETE_COMPLETE)
              STACK_ACTION="create-stack"
              echo "Creating new stack $STACK_NAME"
              ;;
            DELETE_FAILED)
              echo "ERROR: stack is DELETE_FAILED - resolve the stuck deletion by hand, then rerun"
              exit 1
              ;;
            *_IN_PROGRESS)
              echo "ERROR: stack is busy ($STACK_STATUS) - wait for the current operation to finish, then rerun"
              exit 1
              ;;
            *)
              STACK_ACTION="update-stack"
              echo "Updating existing stack $STACK_NAME"
              ;;
          esac

          OUTPUT=$(aws cloudformation $STACK_ACTION \
            --stack-name "$STACK_NAME" \
            --template-body file://cloudformation/template.yaml \
            --parameters \
              ParameterKey=Environment,ParameterValue=${{ inputs.environment }} \
              ParameterKey=Namespace,ParameterValue=${{ vars.AWS_ACCOUNT_ID }} \
              ParameterKey=DomainName,ParameterValue=$DOMAIN_NAME \
              ParameterKey=HostedZoneId,ParameterValue=$HOSTED_ZONE_ID \
              ParameterKey=WwwDomainName,ParameterValue=$WWW_DOMAIN_NAME \
              ParameterKey=LegacyDomainName,ParameterValue=$LEGACY_DOMAIN_NAME \
              ParameterKey=LegacyHostedZoneId,ParameterValue=$LEGACY_HOSTED_ZONE_ID \
            2>&1) || true

          if echo "$OUTPUT" | grep -q "No updates are to be performed"; then
            echo "Stack already up to date."
          elif echo "$OUTPUT" | grep -qi "error"; then
            echo "Stack deploy failed: $OUTPUT"
            exit 1
          else
            echo "Stack $STACK_ACTION initiated."
          fi

      - name: Wait for stack to settle
        # Poll the stack's own status rather than an AWS waiter: the waiters
        # are per-operation (create vs update), the wrong one returns at once,
        # and the old `|| true` then let the S3 sync run while CloudFront was
        # still applying an update (2026-09-09). A stack that had nothing to
        # update is already *_COMPLETE and passes on the first poll.
        run: |
          for i in $(seq 1 56); do
            STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query 'Stacks[0].StackStatus' --output text)
            case "$STATUS" in
              *_IN_PROGRESS)
                echo "$STATUS (poll $i)"; sleep 30 ;;
              CREATE_COMPLETE|UPDATE_COMPLETE)
                echo "Stack $STATUS"; exit 0 ;;
              *)
                echo "ERROR: stack ended in $STATUS"
                aws cloudformation describe-stack-events --stack-name "$STACK_NAME" --max-items 20 \
                  --query 'StackEvents[?contains(ResourceStatus, `FAILED`)].[LogicalResourceId,ResourceStatusReason]' \
                  --output text
                exit 1 ;;
            esac
          done
          echo "ERROR: stack still in progress after 28 minutes"; exit 1

      - name: Read stack outputs
        id: outputs
        run: |
          get() {
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          BUCKET=$(get StaticAssetsBucketName)
          DIST=$(get CloudFrontDistributionId)
          URL=$(get ViewerUrl)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution=$DIST" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Bucket: $BUCKET · Distribution: $DIST · URL: $URL"

      - name: Sync build to S3
        run: |
          BUCKET="${{ steps.outputs.outputs.bucket }}"
          # Hashed assets are immutable → long cache. Everything with a fixed
          # name must revalidate instead, or an immutable header pins returning
          # browsers to a stale copy for up to a year (immutable is never
          # revalidated — CloudFront invalidation can't reach a browser's cache):
          # every lane's index.html (index.html, file/, mcp/ — the pattern needs
          # the leading * to match the nested ones), the sample holons, and the
          # sitemap, robots.txt and share image.
          aws s3 sync dist/ "s3://$BUCKET" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*index.html" --exclude "samples/*" \
            --exclude sitemap.xml --exclude robots.txt --exclude og.png
          aws s3 sync dist/samples/ "s3://$BUCKET/samples/" \
            --cache-control "public,max-age=300,must-revalidate" \
            --content-type "application/ld+json"
          aws s3 sync dist/ "s3://$BUCKET" \
            --exclude "*" --include sitemap.xml --include robots.txt --include og.png \
            --cache-control "public,max-age=300,must-revalidate"
          aws s3 sync dist/ "s3://$BUCKET" \
            --exclude "*" --include "*index.html" \
            --cache-control "no-cache" --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution }}" \
            --paths "/*"

      - name: Summary
        run: |
          echo "## 🚀 xbrlkit viewer deployed (${{ inputs.environment }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${{ steps.outputs.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Bucket:** \`${{ steps.outputs.outputs.bucket }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Distribution:** \`${{ steps.outputs.outputs.distribution }}\`" >> "$GITHUB_STEP_SUMMARY"
